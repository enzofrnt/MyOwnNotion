# Production-like integration topology.
#
# The application has no authentication yet. Every published port is therefore
# loopback-only by default and must not be exposed to an untrusted network.
name: myownnotion

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${MYOWNNOTION_DB_NAME:-myownnotion}
      POSTGRES_USER: ${MYOWNNOTION_DB_USER:-myownnotion}
      POSTGRES_PASSWORD: ${MYOWNNOTION_DB_PASSWORD:?Set MYOWNNOTION_DB_PASSWORD in .env.prod}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${MYOWNNOTION_DB_USER:-myownnotion} -d ${MYOWNNOTION_DB_NAME:-myownnotion}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${MYOWNNOTION_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    image: ghcr.io/enzofrnt/myownnotion-api:${MYOWNNOTION_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
    command: ["node", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:?Set MYOWNNOTION_DB_PASSWORD in .env.prod}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MYOWNNOTION_S3_ACCESS_KEY:?Set MYOWNNOTION_S3_ACCESS_KEY in .env.prod}
      MINIO_ROOT_PASSWORD: ${MYOWNNOTION_S3_SECRET_KEY:?Set MYOWNNOTION_S3_SECRET_KEY in .env.prod}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/minio/health/cluster
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "9000"
    volumes:
      - object-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ghcr.io/enzofrnt/myownnotion-api:${MYOWNNOTION_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
    environment:
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:?Set MYOWNNOTION_DB_PASSWORD in .env.prod}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
      MYOWNNOTION_API_HOST: 0.0.0.0
      MYOWNNOTION_API_PORT: 3001
      MYOWNNOTION_STORAGE_ADAPTER: s3
      MYOWNNOTION_S3_ENDPOINT: http://object-storage:9000
      MYOWNNOTION_S3_REGION: ${MYOWNNOTION_S3_REGION:-us-east-1}
      MYOWNNOTION_S3_BUCKET: ${MYOWNNOTION_S3_BUCKET:-myownnotion-private}
      MYOWNNOTION_S3_ACCESS_KEY: ${MYOWNNOTION_S3_ACCESS_KEY:?Set MYOWNNOTION_S3_ACCESS_KEY in .env.prod}
      MYOWNNOTION_S3_SECRET_KEY: ${MYOWNNOTION_S3_SECRET_KEY:?Set MYOWNNOTION_S3_SECRET_KEY in .env.prod}
      MYOWNNOTION_S3_PREFIX: ${MYOWNNOTION_S3_PREFIX:-blobs}
      MYOWNNOTION_RESTORE_GUARD: /var/lib/myownnotion/operations/.restore-in-progress
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${MYOWNNOTION_API_PORT:-3001}:3001"
    volumes:
      - operations-state:/var/lib/myownnotion/operations:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ghcr.io/enzofrnt/myownnotion-web:${MYOWNNOTION_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:${MYOWNNOTION_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  operations:
    profiles: ["operations"]
    image: ghcr.io/enzofrnt/myownnotion-operations:${MYOWNNOTION_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/operations/Dockerfile
      args:
        VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
    environment:
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:?Set MYOWNNOTION_DB_PASSWORD in .env.prod}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
      MYOWNNOTION_STORAGE_ADAPTER: s3
      MYOWNNOTION_S3_ENDPOINT: http://object-storage:9000
      MYOWNNOTION_S3_REGION: ${MYOWNNOTION_S3_REGION:-us-east-1}
      MYOWNNOTION_S3_BUCKET: ${MYOWNNOTION_S3_BUCKET:-myownnotion-private}
      MYOWNNOTION_S3_ACCESS_KEY: ${MYOWNNOTION_S3_ACCESS_KEY:?Set MYOWNNOTION_S3_ACCESS_KEY in .env.prod}
      MYOWNNOTION_S3_SECRET_KEY: ${MYOWNNOTION_S3_SECRET_KEY:?Set MYOWNNOTION_S3_SECRET_KEY in .env.prod}
      MYOWNNOTION_S3_PREFIX: ${MYOWNNOTION_S3_PREFIX:-blobs}
      MYOWNNOTION_VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
      MYOWNNOTION_OPERATIONS_LOCK: /var/lib/myownnotion/operations/operations.lock
      MYOWNNOTION_LEGACY_BLOB_ROOT: /var/lib/myownnotion/legacy-blobs
      MYOWNNOTION_OPERATIONS_STAGING: /var/lib/myownnotion/staging
      MYOWNNOTION_BACKUP_STATUS: /var/lib/myownnotion/operations/backup.json
      MYOWNNOTION_BACKUP_SCHEDULE_STATE: /var/lib/myownnotion/operations/backup-schedule.json
      MYOWNNOTION_RESTORE_STAGING: /var/lib/myownnotion/staging
      MYOWNNOTION_RESTORE_GUARD: /var/lib/myownnotion/operations/.restore-in-progress
      MYOWNNOTION_POSTGRES_MAJOR: 18
      MYOWNNOTION_MIGRATIONS_ROOT: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    volumes:
      - operations-state:/var/lib/myownnotion/operations
      - operations-staging:/var/lib/myownnotion/staging
      - blob-data:/var/lib/myownnotion/legacy-blobs:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup-operations: &backup-operations
    profiles: ["backup"]
    image: ghcr.io/enzofrnt/myownnotion-operations:${MYOWNNOTION_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/operations/Dockerfile
      args:
        VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
    environment:
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:?Set MYOWNNOTION_DB_PASSWORD in .env.prod}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
      MYOWNNOTION_STORAGE_ADAPTER: s3
      MYOWNNOTION_S3_ENDPOINT: http://object-storage:9000
      MYOWNNOTION_S3_REGION: ${MYOWNNOTION_S3_REGION:-us-east-1}
      MYOWNNOTION_S3_BUCKET: ${MYOWNNOTION_S3_BUCKET:-myownnotion-private}
      MYOWNNOTION_S3_ACCESS_KEY: ${MYOWNNOTION_S3_ACCESS_KEY:?Set MYOWNNOTION_S3_ACCESS_KEY in .env.prod}
      MYOWNNOTION_S3_SECRET_KEY: ${MYOWNNOTION_S3_SECRET_KEY:?Set MYOWNNOTION_S3_SECRET_KEY in .env.prod}
      MYOWNNOTION_S3_PREFIX: ${MYOWNNOTION_S3_PREFIX:-blobs}
      MYOWNNOTION_VCS_REF: ${MYOWNNOTION_VCS_REF:-local}
      MYOWNNOTION_OPERATIONS_LOCK: /var/lib/myownnotion/operations/operations.lock
      MYOWNNOTION_OPERATIONS_STAGING: /var/lib/myownnotion/staging
      MYOWNNOTION_BACKUP_STATUS: /var/lib/myownnotion/operations/backup.json
      MYOWNNOTION_BACKUP_SCHEDULE_STATE: /var/lib/myownnotion/operations/backup-schedule.json
      MYOWNNOTION_RESTORE_STAGING: /var/lib/myownnotion/staging
      MYOWNNOTION_RESTORE_GUARD: /var/lib/myownnotion/operations/.restore-in-progress
      MYOWNNOTION_POSTGRES_MAJOR: 18
      MYOWNNOTION_BACKUP_SCHEDULE_UTC: ${MYOWNNOTION_BACKUP_SCHEDULE_UTC:-02:00}
      MYOWNNOTION_BACKUP_KEEP_DAILY: ${MYOWNNOTION_BACKUP_KEEP_DAILY:-7}
      MYOWNNOTION_BACKUP_KEEP_WEEKLY: ${MYOWNNOTION_BACKUP_KEEP_WEEKLY:-4}
      MYOWNNOTION_BACKUP_KEEP_MONTHLY: ${MYOWNNOTION_BACKUP_KEEP_MONTHLY:-12}
      MYOWNNOTION_MIGRATIONS_ROOT: /app/migrations
      RESTIC_REPOSITORY: ${MYOWNNOTION_RESTIC_REPOSITORY:-/var/lib/myownnotion/backup-destination}
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      RCLONE_CONFIG: /run/secrets/rclone.conf
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    volumes:
      - operations-state:/var/lib/myownnotion/operations
      - operations-staging:/var/lib/myownnotion/staging
      - type: bind
        source: ${MYOWNNOTION_BACKUP_SECRETS_DIR:-./.backup-secrets}
        target: /run/secrets
        read_only: true
      - type: bind
        source: ${MYOWNNOTION_BACKUP_DESTINATION:-./.backup-destination}
        target: /var/lib/myownnotion/backup-destination
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup-scheduler:
    <<: *backup-operations
    profiles: ["backup-scheduler"]
    command: ["backup", "schedule"]
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
  blob-data:
  operations-state:
  operations-staging:
