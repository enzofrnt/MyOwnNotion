# Development-only overrides (feature 002, FR-030 – FR-032).
#
# This override builds `api` and `web` locally instead of pulling immutable
# published images, publishes PostgreSQL on the loopback interface, and enables
# the explicitly named loopback-HTTP cookie exception
# (`MYOWNNOTION_DEV_LOOPBACK_HTTP_COOKIE=1`). It is never used in production:
# the official stack in compose.yaml selects published images and issues the
# `__Host-mn_session` Secure cookie behind the administrator's HTTPS proxy.
services:
  postgres:
    ports:
      - "127.0.0.1:${MYOWNNOTION_DB_PORT:-5432}:5432"

  # Shares the API image, so it must share the locally built one too:
  # otherwise the schema job would run the published image against a database
  # the freshly built API is about to use.
  migrate:
    image: myownnotion/api:dev
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    read_only: false

  api:
    image: myownnotion/api:dev
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      # The local-build override is read by a developer, not a log collector.
      # Compose stdout is non-TTY, so opt into Pino's readable ANSI renderer.
      MYOWNNOTION_LOG_COLOR: ${MYOWNNOTION_DEV_LOG_COLOR:-always}
      MYOWNNOTION_DEV_LOOPBACK_HTTP_COOKIE: "1"
      MYOWNNOTION_PUBLIC_ORIGIN: ${MYOWNNOTION_PUBLIC_ORIGIN:-http://127.0.0.1:5173}
    read_only: false

  web:
    image: myownnotion/web:dev
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        MYOWNNOTION_API_URL: ${MYOWNNOTION_API_URL:-http://127.0.0.1:3001}
    read_only: false
