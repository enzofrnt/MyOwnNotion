# Single-origin delivery for the web client: static shell here, `/v1/` and
# `/health` proxied to the API so both live behind one public origin.
#
# HTTPS termination, HSTS, and the public origin are the hosting
# administrator's external reverse proxy (docs/deployment/reverse-proxy.md);
# this server block never terminates TLS and never sets a cookie of its own.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The API is served from this same origin, on purpose.
    #
    # `MYOWNNOTION_PUBLIC_ORIGIN` is a single origin, and the production
    # session cookie is `__Host-`-prefixed: it carries no Domain and is sent
    # only back to the exact origin that set it. Serving the client on one
    # origin and the API on another would leave the browser holding a cookie
    # it never attaches, so the client's relative `/v1/...` calls must reach
    # the API here rather than cross-origin. Without this the client fetched
    # its own index.html for every API call.
    location /v1/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File uploads are bounded by the API's own limits, not by nginx's
        # default 1m, which would reject them before the API could answer.
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://api:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable; the shell and service worker are not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
