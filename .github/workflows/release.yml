# Version-tag publication (T103, US6, FR-032 – FR-035).
#
# One trigger, and it is deliberately narrow: a tag matching
# `v<major>.<minor>.<patch>` exactly. There is no `main` trigger here, because
# `ci.yml` already publishes a commit-addressable image for every commit on
# `main` — a second path publishing the same commit under a different name
# would be two answers to "what is running", which is the question images with
# immutable tags exist to answer once.
#
# The structure of this file is one idea: **publication depends on a gate that
# provably ran on this exact commit.**
#
# It gets that by *calling* `ci.yml` rather than reacting to it. A
# `workflow_run` trigger fires after some earlier run finished, and the run it
# reports on may be for a different commit — the classic way a release is
# published on evidence from something else. Calling the reusable workflow
# means the gate runs here, now, on `github.sha`, and its exported
# `candidate_sha` is compared against this workflow's own before anything is
# pushed.
name: Release

on:
  push:
    tags:
      # Anchored at both ends. A loose pattern would match `v1.2.3-rc1` and
      # `v1.2.3-broken`, and a release candidate published to the same
      # immutable channel as a release is a release nobody meant to make.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # The full quality gate, run here, on this tag's commit. Every security job,
  # every test, the image build — the same definition `main` and every pull
  # request run, because a release verified by a weaker gate is a release
  # verified by a different gate.
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-candidate:
    name: Verify the gate ran on this commit
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: read
    steps:
      - name: Compare the gate's candidate against this release
        # The anti-staleness check, and it is a comparison rather than an
        # assumption. If these ever differ, something has arranged for a
        # release to be verified by evidence from another commit, and that is
        # exactly the failure the whole structure exists to prevent.
        env:
          GATE_SHA: ${{ needs.quality-gate.outputs.candidate_sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "gate:    $GATE_SHA"
          echo "release: $RELEASE_SHA"
          if [ -z "$GATE_SHA" ]; then
            echo "The gate exported no candidate SHA; refusing to publish."
            exit 1
          fi
          if [ "$GATE_SHA" != "$RELEASE_SHA" ]; then
            echo "The gate ran on a different commit; refusing to publish."
            exit 1
          fi
          echo "The gate ran on this commit."

  publish-release-images:
    name: Publish version-tagged images
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - verify-candidate
    # Both must have succeeded. `verify-candidate` alone would be enough for
    # freshness and says nothing about whether the gate passed; `quality-gate`
    # alone says nothing about which commit it ran on.
    if: needs.quality-gate.result == 'success' && needs.verify-candidate.result == 'success'
    # The only job in this workflow granted package writes.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read immutable release inputs
        id: release-meta
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/${owner}/${repo}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          version="${GITHUB_REF_NAME}"
          node_base=$(jq -r '.bases.node | "\(.ref)@\(.digest)"' docker/base-images.json)
          nginx_base=$(jq -r '.bases.nginx | "\(.ref)@\(.digest)"' docker/base-images.json)
          platforms=$(jq -r '.platforms | join(",")' docker/base-images.json)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "source_url=$source_url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "node=$node_base" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx_base" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Publish immutable version-tagged API image
        id: release-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: ${{ steps.release-meta.outputs.platforms }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.release-meta.outputs.node }}
            APPLICATION_VERSION=sha-${{ github.sha }}
          tags: |
            ${{ steps.release-meta.outputs.registry }}-api:${{ steps.release-meta.outputs.version }}
            ${{ steps.release-meta.outputs.registry }}-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ steps.release-meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release-meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=myownnotion-api
          annotations: |
            index:org.opencontainers.image.source=${{ steps.release-meta.outputs.source_url }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.release-meta.outputs.version }}
            index:org.opencontainers.image.description=MyOwnNotion api
          cache-from: type=gha,scope=api-release-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=api-release-${{ github.sha }},ignore-error=true
      - name: Publish immutable version-tagged web image
        id: release-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: ${{ steps.release-meta.outputs.platforms }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.release-meta.outputs.node }}
            NGINX_BASE=${{ steps.release-meta.outputs.nginx }}
          tags: |
            ${{ steps.release-meta.outputs.registry }}-web:${{ steps.release-meta.outputs.version }}
            ${{ steps.release-meta.outputs.registry }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ steps.release-meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release-meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=myownnotion-web
          annotations: |
            index:org.opencontainers.image.source=${{ steps.release-meta.outputs.source_url }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.release-meta.outputs.version }}
            index:org.opencontainers.image.description=MyOwnNotion web
          cache-from: type=gha,scope=web-release-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=web-release-${{ github.sha }},ignore-error=true
      - name: Record released digests for the validated commit
        env:
          API_DIGEST: ${{ steps.release-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.release-web.outputs.digest }}
          PLATFORMS: ${{ steps.release-meta.outputs.platforms }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --arg platforms "$PLATFORMS" \
            --arg api "$API_DIGEST" \
            --arg web "$WEB_DIGEST" \
            '{
               candidateSha: $sha,
               version: $version,
               platforms: ($platforms | split(",")),
               images: {
                 api: $api,
                 web: $web
               }
             }' > released-images.json
          cat released-images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-images
          path: released-images.json
          if-no-files-found: error
