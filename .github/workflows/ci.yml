# Single quality gate for the repository (feature 002, T100–T102).
#
# One logical gate, four invocation paths, all running the same aggregate
# `quality-gate` job:
#
#   - `pull_request`  — the first automated gate. Pushing a work branch runs
#     nothing, matching constitution v1.3.0; there is deliberately no non-main
#     branch push trigger.
#   - `push` to `main` — the same gate, plus commit-image publication in the
#     same run.
#   - `workflow_dispatch` — diagnostics only. It has no publication job and no
#     package-write permission, so it cannot publish even by accident.
#   - `workflow_call` — used by release.yml at a version tag; exports
#     `candidate_sha` so the caller can prove the gate ran on its own commit.
#
# Permissions are least-privilege: `contents: read` at workflow level, and
# `packages: write` granted to the publication job alone. On a pull request an
# attempted registry write therefore fails for lack of permission rather than
# succeeding silently.
#
# Deliberately absent for now: the vulnerability-scanning jobs T100 and T101
# also describe — dependency audit, secret scan, static security analysis,
# license policy, and the container scan. They are deferred until the
# application is functionally complete, so they land against something worth
# auditing rather than blocking construction. The scripts already exist
# (`pnpm security:audit|secrets|static|licenses`) and can be run by hand in the
# meantime; only their wiring into the gate is postponed. T100 and T101 stay
# unchecked in tasks.md until they are wired in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      candidate_sha:
        description: The commit the quality gate evaluated.
        value: ${{ jobs.quality-gate.outputs.candidate_sha }}

permissions:
  contents: read

env:
  CI: "true"
  SHELLCHECK_VERSION: "0.11.0"
  SHFMT_VERSION: "3.12.0"

jobs:
  install:
    name: Frozen install & toolchain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm toolchain:check

  lint:
    name: Biome format & lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  shell:
    name: ShellCheck & shfmt
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned ShellCheck and shfmt
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install /tmp/shfmt /usr/local/bin/shfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm shell:check

  typecheck:
    name: Strict TypeScript
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit, property & coverage
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration:
    name: Database integration & migrations
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm db:test-migrations

  contract:
    name: API & workspace contract tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browsers are ~400 MB and identical between runs of the same Playwright
      # version. The key is that version and nothing else: keying on the
      # lockfile would miss the cache on every unrelated dependency change, and
      # keying on less would serve browsers to a Playwright that cannot drive
      # them.
      - id: playwright-version
        run: echo "value=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - name: Install browsers
        # `--with-deps` still runs on a hit: the system libraries live outside
        # the cached directory, and a cached browser without them fails at
        # launch with an error that says nothing about the cause.
        run: pnpm exec playwright install --with-deps
      - name: Start disposable PostgreSQL and migrate
        run: |
          docker compose up -d --wait postgres || {
            echo "::group::postgres logs (startup failed)"
            docker compose logs postgres
            echo "::endgroup::"
            exit 1
          }
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://myownnotion:myownnotion-dev@127.0.0.1:5432/myownnotion
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://myownnotion:myownnotion-dev@127.0.0.1:5432/myownnotion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    name: Production builds
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build





  build-images:
    name: Multi-architecture image build
    runs-on: ubuntu-latest
    needs: install
    # No `packages: write`. This job runs on every candidate including pull
    # requests and publishes nothing; an attempted registry write fails on
    # permission rather than succeeding silently.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build linux/amd64 and linux/arm64 from pinned base digests
        # `pnpm images:build` refuses to run while any base digest in
        # docker/base-images.json is empty, so an unpinned base blocks here.
        run: pnpm images:build
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-build
          path: image-build.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The five blocking security jobs (T100, FR-033 – FR-035)
  # ---------------------------------------------------------------------------
  #
  # Five jobs rather than one, and each producing a named artifact, because the
  # requirement is that they are *individually observable*. A single "security"
  # job that ran all five would be one red X hiding which of five very different
  # problems occurred — a vulnerable dependency, a committed secret, a dangerous
  # code pattern, a vulnerable base image, and a forbidden licence are not the
  # same emergency and do not have the same fix.
  #
  # Every one of them runs on the candidate SHA that the rest of the gate ran
  # on, because they are checked out from the same event.

  dependency-vulnerability-audit:
    name: dependency-vulnerability-audit
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # Written whatever the outcome: an audit that produced no artifact
        # because it failed is indistinguishable, to the aggregate, from one
        # that never ran.
        run: pnpm security:audit --json > dependency-audit.json || (cat dependency-audit.json; exit 1)
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The full history, because a secret committed and then removed is
          # still a leaked secret: the object stays reachable in the repository.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan
          path: secret-scan.sarif
          if-no-files-found: error

  static-security-analysis:
    name: static-security-analysis
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:static
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-security
          path: static-security.sarif
          if-no-files-found: error

  container-vulnerability-scan:
    name: container-vulnerability-scan
    runs-on: ubuntu-latest
    # Depends on `build-images` so it scans the same commit's images rather
    # than an unrelated build. It rebuilds locally rather than pulling: nothing
    # is published at this point in the pipeline, so there is no registry
    # reference to scan.
    needs: build-images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the API image for scanning
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: myownnotion-api:scan
      - name: Scan it
        # Trivy rather than a scanner written here. A vulnerability database is
        # not something this repository should be maintaining, and the value of
        # the job is entirely in the database being current.
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # 0.30.0
        with:
          image-ref: myownnotion-api:scan
          format: sarif
          output: container-scan.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-scan
          path: container-scan.sarif
          if-no-files-found: error

  license-policy:
    name: license-policy
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:licenses
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-policy
          path: license-policy.json
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    outputs:
      # Exported for release.yml, which compares it to its own `github.sha`.
      # Stale or foreign-commit gate evidence is therefore detectable.
      candidate_sha: ${{ github.sha }}
    needs:
      - install
      - lint
      - shell
      - typecheck
      - unit
      - integration
      - contract
      - e2e
      - build
      - build-images
      - dependency-vulnerability-audit
      - secret-scan
      - static-security-analysis
      - container-vulnerability-scan
      - license-policy
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # `success` and nothing else. `skipped` and `cancelled` are failures
        # here, and that is the point of comparing against one value rather
        # than excluding `failure`: a job that was skipped produced no evidence,
        # and a gate that treats "no evidence" as "no problem" is not a gate.
        #
        # A job missing from `needs` entirely cannot be caught by this script —
        # it would simply not appear. That is what the contract test in
        # `tests/contract/release-gates.spec.ts` is for: it reads this file and
        # asserts the required set.
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "The following required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs succeeded."

  publish-commit-images:
    name: Publish commit-addressable images
    runs-on: ubuntu-latest
    needs: quality-gate
    # Publication lives in the same workflow and the same run as the gate, and
    # is guarded on both the branch and the gate result. No `workflow_run` or
    # other indirect completion trigger is involved, so stale or foreign-commit
    # gate evidence is structurally impossible on this path. A
    # `workflow_dispatch` diagnostic run never satisfies the ref condition.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    # The only job in this workflow granted package writes.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit-addressable images
        # Tagged by the exact commit the gate evaluated. No moving tag: there
        # is deliberately no `latest`, so a deployment always names the commit
        # it is running.
        #
        # Two things beyond the push itself, both required for the images to be
        # usable:
        #
        #   - `org.opencontainers.image.source` links the package to this
        #     repository. Without it GHCR keeps the package unattached, so it
        #     never appears under the repository's Packages tab and has no
        #     visible provenance. The label goes on the image config *and* as an
        #     index annotation, because a multi-architecture push publishes a
        #     manifest list and GHCR reads the link from the index.
        #   - Flat `myownnotion-api` / `myownnotion-web` names rather than a
        #     nested `myownnotion/api`. A nested path creates a package literally
        #     called `myownnotion/api`, which is awkward to address and does not
        #     match how the repository's images are referenced elsewhere.
        run: |
          set -euo pipefail
          # `tr` rather than bash's `${VAR,,}`: the latter needs bash 4+, which
          # the runner has but a local shell may not, and a naming rule that
          # cannot be exercised locally is one that breaks in CI only.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/${owner}/${repo}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          node_base=$(jq -r '.bases.node | "\(.ref)@\(.digest)"' docker/base-images.json)
          nginx_base=$(jq -r '.bases.nginx | "\(.ref)@\(.digest)"' docker/base-images.json)
          platforms=$(jq -r '.platforms | join(",")' docker/base-images.json)

          publish() {
            local target="$1"; shift
            docker buildx build --platform "$platforms" --push \
              --file "docker/${target}.Dockerfile" \
              --build-arg "NODE_BASE=$node_base" \
              "$@" \
              --provenance=true --sbom=true \
              --label "org.opencontainers.image.source=$source_url" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
              --label "org.opencontainers.image.title=myownnotion-${target}" \
              --annotation "index:org.opencontainers.image.source=$source_url" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.description=MyOwnNotion ${target}" \
              --metadata-file "publish-${target}.json" \
              --tag "${registry}-${target}:sha-${GITHUB_SHA}" .
          }

          publish api
          publish web --build-arg "NGINX_BASE=$nginx_base"

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg platforms "$platforms" \
            --slurpfile api publish-api.json \
            --slurpfile web publish-web.json \
            '{
               candidateSha: $sha,
               platforms: ($platforms | split(",")),
               images: {
                 api: $api[0]["containerimage.digest"],
                 web: $web[0]["containerimage.digest"]
               }
             }' > published-images.json
          cat published-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-images
          path: published-images.json
          if-no-files-found: error
