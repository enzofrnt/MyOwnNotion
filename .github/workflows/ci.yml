# Single quality gate for the repository (feature 002, T100–T102).
#
# One logical gate, four invocation paths, all running the same aggregate
# `quality-gate` job:
#
#   - `pull_request`  — the first automated gate. Pushing a work branch runs
#     nothing, matching constitution v1.3.0; there is deliberately no non-main
#     branch push trigger.
#   - `push` to `main` — the same gate, plus commit-image publication in the
#     same run.
#   - `workflow_dispatch` — diagnostics only. It has no publication job and no
#     package-write permission, so it cannot publish even by accident.
#   - `workflow_call` — used by release.yml at a version tag; exports
#     `candidate_sha` so the caller can prove the gate ran on its own commit.
#
# Permissions are least-privilege: `contents: read` at workflow level, and
# `packages: write` granted to the publication job alone. On a pull request an
# attempted registry write therefore fails for lack of permission rather than
# succeeding silently.
#
# Dependency audit, secret scan, static analysis, license policy, and the
# container scan are all blocking jobs below and are required by
# `quality-gate`. Their underlying repository scripts also run in the local
# pre-push gate; GitHub-only SARIF publication remains a CI responsibility.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      candidate_sha:
        description: The commit the quality gate evaluated.
        value: ${{ jobs.quality-gate.outputs.candidate_sha }}

permissions:
  contents: read

# A new commit supersedes older work for the same pull request. Trusted runs
# keep distinct ref-based groups and are never cancelled by an unrelated PR.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  SHELLCHECK_VERSION: "0.11.0"
  SHFMT_VERSION: "3.12.0"

jobs:
  impact:
    name: Deterministic test impact plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      integration_mode: ${{ steps.plan.outputs.integration_mode }}
      contract_mode: ${{ steps.plan.outputs.contract_mode }}
      e2e_mode: ${{ steps.plan.outputs.e2e_mode }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
      cache_scope: ${{ steps.plan.outputs.cache_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Calculate and validate the exact candidate impact
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          node scripts/ci/test-impact.ts \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --output test-impact.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-impact-plan
          path: test-impact.json
          if-no-files-found: error
          retention-days: 14

  install:
    name: Frozen install & toolchain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm toolchain:check

  lint:
    name: Biome format & lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  shell:
    name: ShellCheck & shfmt
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned ShellCheck and shfmt
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install /tmp/shfmt /usr/local/bin/shfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm shell:check

  typecheck:
    name: Strict TypeScript
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit, property & coverage
    runs-on: ubuntu-latest
    needs: impact
    steps:
      - name: No impacted unit tests
        if: needs.impact.outputs.unit_mode == 'none'
        run: echo "No unit tests are impacted; recording a successful no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.impact.outputs.unit_mode != 'none'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.impact.outputs.unit_mode != 'none'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.impact.outputs.unit_mode != 'none'
        with:
          node-version: 24
          cache: pnpm
      - if: needs.impact.outputs.unit_mode != 'none'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.impact.outputs.unit_mode != 'none'
        with:
          name: test-impact-plan
      - if: needs.impact.outputs.unit_mode != 'none'
        run: pnpm ci:test:affected --plan test-impact.json --group unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.impact.outputs.unit_mode == 'full'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration:
    name: Database integration & migrations
    runs-on: ubuntu-latest
    needs: impact
    steps:
      - name: No impacted integration tests
        if: needs.impact.outputs.integration_mode == 'none'
        run: echo "No integration tests are impacted; recording a successful no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.impact.outputs.integration_mode != 'none'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.impact.outputs.integration_mode != 'none'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.impact.outputs.integration_mode != 'none'
        with:
          node-version: 24
          cache: pnpm
      - if: needs.impact.outputs.integration_mode != 'none'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.impact.outputs.integration_mode != 'none'
        with:
          name: test-impact-plan
      - if: needs.impact.outputs.integration_mode != 'none'
        run: pnpm ci:test:affected --plan test-impact.json --group integration

  reference-backups:
    name: Restore every supported reference backup
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This is intentionally not impact-filtered. A committed reference
      # archive is compatibility evidence for every candidate, including one
      # whose apparent source impact does not reach the restore code.
      - run: pnpm test:reference-backups

  contract:
    name: API & workspace contract tests
    runs-on: ubuntu-latest
    needs: impact
    steps:
      - name: No impacted contract tests
        if: needs.impact.outputs.contract_mode == 'none'
        run: echo "No contract tests are impacted; recording a successful no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.impact.outputs.contract_mode != 'none'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.impact.outputs.contract_mode != 'none'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.impact.outputs.contract_mode != 'none'
        with:
          node-version: 24
          cache: pnpm
      - if: needs.impact.outputs.contract_mode != 'none'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.impact.outputs.contract_mode != 'none'
        with:
          name: test-impact-plan
      - if: needs.impact.outputs.contract_mode != 'none'
        run: pnpm ci:test:affected --plan test-impact.json --group contract

  e2e:
    name: Playwright journeys (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: impact
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.e2e_matrix) }}
    steps:
      - name: No impacted browser journeys
        if: matrix.project == 'none'
        run: echo "No E2E journeys are impacted; recording a successful no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.project != 'none'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.project != 'none'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.project != 'none'
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.project != 'none'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.project != 'none'
        with:
          name: test-impact-plan
      # Browsers are ~400 MB and identical between runs of the same Playwright
      # version. The key is that version plus runner compatibility and nothing
      # else: keying on the lockfile would miss the cache on every unrelated
      # dependency change, and keying on less would serve browsers to a
      # Playwright that cannot drive them.
      - id: playwright-version
        if: matrix.project != 'none'
        run: echo "value=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        if: matrix.project != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.value }}
      - name: Install browsers
        if: matrix.project != 'none'
        # `--with-deps` still runs on a hit: the system libraries live outside
        # the cached directory, and a cached browser without them fails at
        # launch with an error that says nothing about the cause.
        run: pnpm exec playwright install --with-deps
      - name: Start disposable PostgreSQL and migrate
        if: matrix.project != 'none'
        run: |
          docker compose up -d --wait postgres || {
            echo "::group::postgres logs (startup failed)"
            docker compose logs postgres
            echo "::endgroup::"
            exit 1
          }
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://myownnotion:myownnotion-dev@127.0.0.1:5432/myownnotion
      - name: Run selected journeys in this isolated project
        if: matrix.project != 'none'
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          DATABASE_URL: postgres://myownnotion:myownnotion-dev@127.0.0.1:5432/myownnotion
        run: |
          mapfile -t journeys < <(jq -r '.e2e.testFiles[]' test-impact.json)
          if [ "${#journeys[@]}" -eq 0 ]; then
            echo "Impact plan selected no journeys for $PLAYWRIGHT_PROJECT."
            exit 1
          fi
          pnpm exec playwright test --fail-on-flaky-tests \
            --project="$PLAYWRIGHT_PROJECT" "${journeys[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.project != 'none'
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    name: Production builds
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  build-images:
    name: Multi-architecture image build
    runs-on: ubuntu-latest
    needs: impact
    # No `packages: write`. This job runs on every candidate including pull
    # requests and publishes nothing; an attempted registry write fails on
    # permission rather than succeeding silently.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Read pinned build inputs
        id: bases
        run: |
          set -euo pipefail
          node=$(jq -r '.bases.node | "\(.ref)@\(.digest)"' docker/base-images.json)
          nginx=$(jq -r '.bases.nginx | "\(.ref)@\(.digest)"' docker/base-images.json)
          platforms=$(jq -r '.platforms | join(",")' docker/base-images.json)
          [[ "$node" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$nginx" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]
          test -n "$platforms"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Build API for every pinned platform
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: ${{ steps.bases.outputs.platforms }}
          push: false
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.bases.outputs.node }}
            APPLICATION_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=api-${{ needs.impact.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=api-${{ needs.impact.outputs.cache_scope }},ignore-error=true
      - name: Build web for every pinned platform
        id: build-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: ${{ steps.bases.outputs.platforms }}
          push: false
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.bases.outputs.node }}
            NGINX_BASE=${{ steps.bases.outputs.nginx }}
          cache-from: type=gha,scope=web-${{ needs.impact.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=web-${{ needs.impact.outputs.cache_scope }},ignore-error=true
      - name: Record exact candidate image evidence
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          PLATFORMS: ${{ steps.bases.outputs.platforms }}
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg platforms "$PLATFORMS" \
            --arg api "$API_DIGEST" \
            --arg web "$WEB_DIGEST" \
            '{
              status: "pass",
              pushed: false,
              candidateSha: $sha,
              platforms: ($platforms | split(",")),
              images: { api: $api, web: $web }
            }' > image-build.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build
          path: image-build.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The five blocking security jobs (T100, FR-033 – FR-035)
  # ---------------------------------------------------------------------------
  #
  # Five jobs rather than one, and each producing a named artifact, because the
  # requirement is that they are *individually observable*. A single "security"
  # job that ran all five would be one red X hiding which of five very different
  # problems occurred — a vulnerable dependency, a committed secret, a dangerous
  # code pattern, a vulnerable base image, and a forbidden licence are not the
  # same emergency and do not have the same fix.
  #
  # Every one of them runs on the candidate SHA that the rest of the gate ran
  # on, because they are checked out from the same event.

  dependency-vulnerability-audit:
    name: dependency-vulnerability-audit
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # Written whatever the outcome: an audit that produced no artifact
        # because it failed is indistinguishable, to the aggregate, from one
        # that never ran.
        run: pnpm security:audit --json > dependency-audit.json || (cat dependency-audit.json; exit 1)
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
      # For the SARIF upload only.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, because a secret committed and then removed is
          # still a leaked secret: the object stays reachable in the repository.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - name: Publish the findings to GitHub
        # Same reasoning as the container scan: GitHub's Security tab already
        # renders SARIF, tracks which alerts are new since the base branch, and
        # annotates pull requests. Reimplementing any of that would mean
        # maintaining it.
        #
        # `always()` because a blocked run is the one worth reading.
        if: always()
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: secret-scan.sarif
          category: secret-scan
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan
          path: secret-scan.sarif
          if-no-files-found: error

  static-security-analysis:
    name: static-security-analysis
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
      # For the SARIF upload only.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:static
      - name: Publish the findings to GitHub
        # `always()` because a blocked run is the one worth reading.
        if: always()
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: static-security.sarif
          category: static-security-analysis
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-security
          path: static-security.sarif
          if-no-files-found: error

  container-vulnerability-scan:
    name: container-vulnerability-scan
    runs-on: ubuntu-latest
    # Depends on `build-images` so it scans the same commit's images rather
    # than an unrelated build. It rebuilds locally rather than pulling: nothing
    # is published at this point in the pipeline, so there is no registry
    # reference to scan.
    needs:
      - build-images
      - impact
    permissions:
      contents: read
      # For the SARIF upload only.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Read the pinned base image
        id: bases
        # The Dockerfile takes its base as a build argument with no default, so
        # a build that omits it fails with `base name should not be blank`.
        # That is the right design — an unpinned base would make two builds of
        # one commit produce different images — and it means every caller has
        # to supply the digest, including this one.
        run: echo "node=$(jq -r '.bases.node | "\(.ref)@\(.digest)"' docker/base-images.json)" >> "$GITHUB_OUTPUT"
      - name: Build the API image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          build-args: |
            NODE_BASE=${{ steps.bases.outputs.node }}
            APPLICATION_VERSION=sha-${{ github.sha }}
          tags: myownnotion-api:scan
          cache-from: type=gha,scope=api-${{ needs.impact.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=api-${{ needs.impact.outputs.cache_scope }},ignore-error=true
      # Two scans, and the split is the whole point of this job being useful.
      #
      # The first run of it found 169 HIGH/CRITICAL vulnerabilities in the
      # Debian base and **not one of them had a fix available**. Blocking on
      # those makes the job impossible to satisfy no matter how fresh the base
      # image is, and a check that can never pass is a check somebody
      # eventually deletes — taking the ones that *are* actionable with it.
      #
      # So: report everything, block on what can be acted upon.
      - name: Record every finding
        # Non-blocking, and the artifact keeps the unfixable ones. They are
        # real, they are worth seeing, and the reason they do not fail the
        # build is that no version of this image would make them go away.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: myownnotion-api:scan
          format: sarif
          output: container-scan.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Fail on anything with a fix available
        # This is the gate. A vulnerability with a published fix means the base
        # image is out of date or a dependency needs raising, and both are
        # things this repository can do something about today.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: myownnotion-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Ensure the artifact exists even if the scan never ran
        # `if-no-files-found: error` is the right setting and it turned one
        # failure into two: the build broke, Trivy never ran, and the upload
        # then failed for a missing file — burying the cause under a second
        # error about a symptom. A stub keeps the real failure the only one.
        if: always()
        run: |
          test -f container-scan.sarif || printf '%s\n' \
            '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"trivy","informationUri":"https://aquasecurity.github.io/trivy/"}},"results":[],"invocations":[{"executionSuccessful":false}]}]}' \
            > container-scan.sarif
      - name: Publish the findings to GitHub
        # GitHub's own SARIF ingestion rather than a report generated here.
        # It puts every finding in the Security tab with its CVE, package and
        # fixed version, annotates pull requests, and tracks which alerts are
        # new since the base branch — none of which is worth reimplementing,
        # and all of which would then need maintaining.
        #
        # `always()` because the run that blocked is exactly the one whose
        # findings someone wants to look at.
        if: always()
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: container-scan.sarif
          # Named, because this repository will eventually upload more than one
          # kind of SARIF and an unnamed category makes the second upload
          # replace the first.
          category: container-vulnerability-scan
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan
          path: container-scan.sarif
          if-no-files-found: error

  license-policy:
    name: license-policy
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:licenses
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-policy
          path: license-policy.json
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    outputs:
      # Exported for release.yml, which compares it to its own `github.sha`.
      # Stale or foreign-commit gate evidence is therefore detectable.
      candidate_sha: ${{ github.sha }}
    needs:
      - impact
      - install
      - lint
      - shell
      - typecheck
      - unit
      - integration
      - reference-backups
      - contract
      - e2e
      - build
      - build-images
      - dependency-vulnerability-audit
      - secret-scan
      - static-security-analysis
      - container-vulnerability-scan
      - license-policy
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # `success` and nothing else. `skipped` and `cancelled` are failures
        # here, and that is the point of comparing against one value rather
        # than excluding `failure`: a job that was skipped produced no evidence,
        # and a gate that treats "no evidence" as "no problem" is not a gate.
        #
        # A job missing from `needs` entirely cannot be caught by this script —
        # it would simply not appear. That is what the contract test in
        # `tests/contract/release-gates.spec.ts` is for: it reads this file and
        # asserts the required set.
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "The following required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs succeeded."

  publish-commit-images:
    name: Publish commit-addressable images
    runs-on: ubuntu-latest
    needs: quality-gate
    # Publication lives in the same workflow and the same run as the gate, and
    # is guarded on both the branch and the gate result. No `workflow_run` or
    # other indirect completion trigger is involved, so stale or foreign-commit
    # gate evidence is structurally impossible on this path. A
    # `workflow_dispatch` diagnostic run never satisfies the ref condition.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    # The only job in this workflow granted package writes.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read immutable publication inputs
        id: publish-meta
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/${owner}/${repo}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          node_base=$(jq -r '.bases.node | "\(.ref)@\(.digest)"' docker/base-images.json)
          nginx_base=$(jq -r '.bases.nginx | "\(.ref)@\(.digest)"' docker/base-images.json)
          platforms=$(jq -r '.platforms | join(",")' docker/base-images.json)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "source_url=$source_url" >> "$GITHUB_OUTPUT"
          echo "node=$node_base" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx_base" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Publish immutable API image
        id: publish-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: ${{ steps.publish-meta.outputs.platforms }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.publish-meta.outputs.node }}
            APPLICATION_VERSION=sha-${{ github.sha }}
          tags: ${{ steps.publish-meta.outputs.registry }}-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ steps.publish-meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=myownnotion-api
          annotations: |
            index:org.opencontainers.image.source=${{ steps.publish-meta.outputs.source_url }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.description=MyOwnNotion api
          cache-from: type=gha,scope=api-main
          cache-to: type=gha,mode=max,scope=api-main,ignore-error=true
      - name: Publish immutable web image
        id: publish-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: ${{ steps.publish-meta.outputs.platforms }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE=${{ steps.publish-meta.outputs.node }}
            NGINX_BASE=${{ steps.publish-meta.outputs.nginx }}
          tags: ${{ steps.publish-meta.outputs.registry }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ steps.publish-meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=myownnotion-web
          annotations: |
            index:org.opencontainers.image.source=${{ steps.publish-meta.outputs.source_url }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.description=MyOwnNotion web
          cache-from: type=gha,scope=web-main
          cache-to: type=gha,mode=max,scope=web-main,ignore-error=true
      - name: Record published digests for the validated commit
        env:
          API_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.publish-web.outputs.digest }}
          PLATFORMS: ${{ steps.publish-meta.outputs.platforms }}
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg platforms "$PLATFORMS" \
            --arg api "$API_DIGEST" \
            --arg web "$WEB_DIGEST" \
            '{
               candidateSha: $sha,
               platforms: ($platforms | split(",")),
               images: {
                 api: $api,
                 web: $web
               }
             }' > published-images.json
          cat published-images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-images
          path: published-images.json
          if-no-files-found: error
