name: Set up the pinned Bun toolchain
description: Install Bun 1.4.0, restore its package cache, and materialize bun.lock exactly.

runs:
  using: composite
  steps:
    - name: Install Bun 1.4.0
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.3
      with:
        bun-version: 1.4.0
    - name: Restore the Bun download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-
    - name: Install the frozen dependency graph
      shell: bash
      run: bun ci
    - name: Verify the active runtime
      shell: bash
      run: test "$(bun --version)" = "1.4.0"
