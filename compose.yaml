# Official single-owner topology (feature 002, FR-030 – FR-032).
#
# Services: `api`, `web`, `postgres`, and the durable `file-store` volume.
# Boundary rules enforced by tests/contract/compose-security.spec.ts and
# `pnpm compose:check`:
#   - every published port binds 127.0.0.1 explicitly; HTTPS termination is the
#     hosting administrator's external reverse proxy and is NOT part of this
#     stack (see docs/deployment/reverse-proxy.md);
#   - no secret value appears here — secrets arrive as mounted files whose
#     paths come from `*_FILE` variables documented in `.env.example`;
#   - images are selected by immutable digest or exact tag, never `latest`.
#
# Every variable carries a default. Compose interpolates the whole file before
# it selects services, so a required-variable `${VAR:?…}` here would break
# `docker compose up -d postgres` — the documented local command. Overriding
# the defaults is a deployment concern; `.env.example` documents each one.
name: myownnotion

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${MYOWNNOTION_DB_NAME:-myownnotion}
      POSTGRES_USER: ${MYOWNNOTION_DB_USER:-myownnotion}
      POSTGRES_PASSWORD: ${MYOWNNOTION_DB_PASSWORD:-myownnotion-dev}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MYOWNNOTION_DB_USER:-myownnotion} -d ${MYOWNNOTION_DB_NAME:-myownnotion}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    volumes:
      # postgres:18+ requires a single mount at /var/lib/postgresql and places
      # data in a major-version subdirectory itself. Mounting
      # /var/lib/postgresql/data makes the image refuse to start ("unused
      # mount/volume"). See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  # One-shot schema job. The API must never migrate on startup: several
  # replicas would race on the same database, and a schema change has to be a
  # distinct operation that either succeeds or stops the rollout.
  migrate:
    image: ${MYOWNNOTION_API_IMAGE:-ghcr.io/enzofrnt/myownnotion-api:v0.1.0}
    command: ["node", "dist/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:-myownnotion-dev}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
      MYOWNNOTION_DEPLOYMENT_KEY_FILE: /run/secrets/deployment-key
      MYOWNNOTION_BLOB_ROOT: /var/lib/myownnotion/blobs
      MYOWNNOTION_BACKUP_DESTINATION: ${MYOWNNOTION_BACKUP_DESTINATION:-filesystem}
      MYOWNNOTION_BACKUP_ROOT: /var/lib/myownnotion/backups
      MYOWNNOTION_BACKUP_HOUR: ${MYOWNNOTION_BACKUP_HOUR:-4}
      MYOWNNOTION_BACKUP_RETENTION_DAYS: ${MYOWNNOTION_BACKUP_RETENTION_DAYS:-90}
    secrets:
      - deployment-key
    volumes:
      - file-store:/var/lib/myownnotion/blobs
      - backup-store:/var/lib/myownnotion/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # A job, not a service: it runs to completion and `api` waits for its exit
    # status. Restarting it on exit would loop forever on a failed migration.
    restart: "no"

  api:
    image: ${MYOWNNOTION_API_IMAGE:-ghcr.io/enzofrnt/myownnotion-api:v0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: UTC
      MYOWNNOTION_API_HOST: 0.0.0.0
      MYOWNNOTION_API_PORT: 3001
      # `auto` sees Compose's non-TTY stdout and therefore emits parseable
      # newline-delimited JSON with no ANSI decoration.
      MYOWNNOTION_LOG_LEVEL: ${MYOWNNOTION_LOG_LEVEL:-info}
      MYOWNNOTION_LOG_COLOR: ${MYOWNNOTION_LOG_COLOR:-auto}
      # Composed from the same values Postgres is initialised with, and
      # deliberately not read from DATABASE_URL: Compose auto-loads `.env`,
      # whose DATABASE_URL points at 127.0.0.1 for host-side development.
      # Inside this container 127.0.0.1 is the container itself, so inheriting
      # it made the API fail to reach Postgres with ECONNREFUSED.
      DATABASE_URL: postgres://${MYOWNNOTION_DB_USER:-myownnotion}:${MYOWNNOTION_DB_PASSWORD:-myownnotion-dev}@postgres:5432/${MYOWNNOTION_DB_NAME:-myownnotion}
      # Defaults to the origin this stack actually serves, so changing the
      # published web port does not silently leave the cookie, CSRF, and
      # WebAuthn origin checks pinned to a port nothing listens on.
      MYOWNNOTION_PUBLIC_ORIGIN: ${MYOWNNOTION_PUBLIC_ORIGIN:-http://127.0.0.1:${MYOWNNOTION_WEB_PORT:-5173}}
      MYOWNNOTION_TRUSTED_PROXY_CIDRS: ${MYOWNNOTION_TRUSTED_PROXY_CIDRS:-}
      MYOWNNOTION_DEV_LOOPBACK_HTTP_COOKIE: ${MYOWNNOTION_DEV_LOOPBACK_HTTP_COOKIE:-0}
      # Path only. The value lives in the mounted secret below.
      MYOWNNOTION_DEPLOYMENT_KEY_FILE: /run/secrets/deployment-key
      MYOWNNOTION_BLOB_ROOT: /var/lib/myownnotion/blobs
      MYOWNNOTION_BACKUP_DESTINATION: ${MYOWNNOTION_BACKUP_DESTINATION:-filesystem}
      MYOWNNOTION_BACKUP_ROOT: /var/lib/myownnotion/backups
      MYOWNNOTION_BACKUP_HOUR: ${MYOWNNOTION_BACKUP_HOUR:-4}
      MYOWNNOTION_BACKUP_RETENTION_DAYS: ${MYOWNNOTION_BACKUP_RETENTION_DAYS:-90}
      MYOWNNOTION_MAX_REQUEST_BYTES: ${MYOWNNOTION_MAX_REQUEST_BYTES:-1048576}
      MYOWNNOTION_MAX_BODY_BYTES: ${MYOWNNOTION_MAX_BODY_BYTES:-1048576}
      MYOWNNOTION_MAX_FILE_BYTES: ${MYOWNNOTION_MAX_FILE_BYTES:-104857600}
    secrets:
      - deployment-key
    volumes:
      - file-store:/var/lib/myownnotion/blobs
      - backup-store:/var/lib/myownnotion/backups
    ports:
      - "127.0.0.1:${MYOWNNOTION_API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    image: ${MYOWNNOTION_WEB_IMAGE:-ghcr.io/enzofrnt/myownnotion-web:v0.1.0}
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:${MYOWNNOTION_WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The diagram editor, served by this installation (feature 005, FR-011).
  #
  # Self-hosted deliberately, and it is a privacy decision rather than a
  # preference. The obvious integration — an iframe pointing at
  # `embed.diagrams.net` — sends the owner's diagram to a third party on every
  # edit, and a diagram of one's own infrastructure is exactly what an owner
  # would never knowingly post to a public service. It would also break offline
  # use, which the product promises.
  #
  # Pinned like every other image here: an editor that silently updates is an
  # editor whose behaviour changes under a deployment nobody touched.
  drawio:
    image: ${MYOWNNOTION_DRAWIO_IMAGE:-jgraph/drawio:24.7.17}
    environment:
      TZ: UTC
      # No telemetry, no external fetches, no plugin marketplace: the point of
      # hosting it is that nothing leaves this installation.
      DRAWIO_SELF_CONTAINED: "1"
    ports:
      - "127.0.0.1:${MYOWNNOTION_DRAWIO_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  # Externally managed deployment wrapping key. The host path is supplied by the
  # hosting administrator; it is never committed and never baked into an image.
  deployment-key:
    file: ${MYOWNNOTION_DEPLOYMENT_KEY_FILE:-./secrets/deployment-key}

volumes:
  postgres-data:
  file-store:
  backup-store:
