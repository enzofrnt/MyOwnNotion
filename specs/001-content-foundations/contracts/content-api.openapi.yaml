openapi: 3.1.0
info:
  title: MyOwnNotion Canonical Content API
  version: 0.1.0
  description: >-
    Development contract for canonical pages, folders, files, placements,
    relationships (including non-hierarchical internal page links), lifecycle, lineage, and export. This feature does not make
    the API safe for public exposure; authentication is specified separately.
servers:
  - url: http://127.0.0.1:3000
    description: Local development only
tags:
  - name: Health
  - name: Items
  - name: Placements
  - name: Relationships
  - name: Revisions
  - name: Page Operations
  - name: Export
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200':
          description: Service and schema are ready
          content:
            application/json:
              schema:
                type: object
                required: [status, schemaVersion]
                properties:
                  status: { const: ready }
                  schemaVersion: { type: integer, minimum: 1 }
                  search: { $ref: '#/components/schemas/SearchHealth' }
                additionalProperties: false
  /v1/items:
    get:
      tags: [Items]
      operationId: listItems
      parameters:
        - in: query
          name: parentItemId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: lifecycle
          schema: { $ref: '#/components/schemas/Lifecycle' }
      responses:
        '200':
          description: Canonical items and requested placements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
    post:
      tags: [Items]
      operationId: createItem
      parameters:
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItem' }
      responses:
        '201':
          description: Item and initial revision created atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/items/{itemId}:
    get:
      tags: [Items]
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item with active placements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Items]
      operationId: updateItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevisionId]
              properties:
                baseRevisionId: { $ref: '#/components/schemas/Uuid' }
                name: { $ref: '#/components/schemas/DisplayName' }
              additionalProperties: false
      responses:
        '200':
          description: Accepted update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/pages/{itemId}/document:
    put:
      tags: [Items]
      operationId: replacePageDocument
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevisionId, document]
              properties:
                baseRevisionId: { $ref: '#/components/schemas/Uuid' }
                document: { $ref: '#/components/schemas/PageDocument' }
                additionalProperties: false
      responses:
        '200':
          description: Page document replaced with a new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/items/{itemId}/trash:
    post:
      tags: [Items]
      operationId: trashItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      responses:
        '200':
          description: Item or branch entered the 30-day trash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/items/{itemId}/trash-impact:
    get:
      tags: [Items]
      operationId: previewTrashImpact
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Database membership impact announced before confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashImpact' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/items/{itemId}/restore:
    post:
      tags: [Items]
      operationId: restoreItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fallbackParentItemId:
                  oneOf:
                    - { $ref: '#/components/schemas/Uuid' }
                    - { type: 'null' }
              additionalProperties: false
      responses:
        '200':
          description: Item restored with a valid placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/items/{itemId}/placements:
    post:
      tags: [Placements]
      operationId: addFilePlacement
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlacement' }
      responses:
        '201':
          description: Placement created without copying logical file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/placements/{placementId}/move:
    post:
      tags: [Placements]
      operationId: movePlacement
      parameters:
        - $ref: '#/components/parameters/PlacementId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentItemId, positionKey]
              properties:
                parentItemId:
                  oneOf:
                    - { $ref: '#/components/schemas/Uuid' }
                    - { type: 'null' }
                positionKey: { type: string, minLength: 1, maxLength: 255 }
              additionalProperties: false
      responses:
        '200':
          description: Placement or complete branch moved atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/placements/{placementId}:
    delete:
      tags: [Placements]
      operationId: removePlacement
      parameters:
        - $ref: '#/components/parameters/PlacementId'
        - $ref: '#/components/parameters/MutationId'
      responses:
        '200':
          description: Placement removed; final file placement also trashes the file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/files:
    post:
      tags: [Items]
      operationId: importFile
      parameters:
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, placement]
              properties:
                file: { type: string, format: binary }
                placement: { $ref: '#/components/schemas/CreatePlacement' }
      responses:
        '201':
          description: Independent logical file imported; physical reuse is not observable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/files/{itemId}/content:
    put:
      tags: [Items]
      operationId: replaceFileContent
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [baseRevisionId, file]
              properties:
                baseRevisionId: { $ref: '#/components/schemas/Uuid' }
                file: { type: string, format: binary }
      responses:
        '200':
          description: File content replaced copy-on-write for every placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/relationships:
    get:
      tags: [Relationships]
      operationId: listRelationships
      parameters:
        - in: query
          name: itemId
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Typed relationships for the workspace or selected item
          content:
            application/json:
              schema:
                type: object
                required: [relationships]
                properties:
                  relationships:
                    type: array
                    items: { $ref: '#/components/schemas/Relationship' }
    post:
      tags: [Relationships]
      operationId: createRelationship
      parameters:
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRelationship' }
      responses:
        '201':
          description: Typed relationship created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/relationships/{relationshipId}:
    delete:
      tags: [Relationships]
      operationId: removeRelationship
      parameters:
        - $ref: '#/components/parameters/RelationshipId'
        - $ref: '#/components/parameters/MutationId'
      responses:
        '200':
          description: Relationship removed through a canonical revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/revisions/{revisionId}:
    get:
      tags: [Revisions]
      operationId: getRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Revision header and restorable snapshot when retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        '404': { $ref: '#/components/responses/Problem' }
        '410':
          description: Header exists but the 24-hour snapshot has expired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/revisions/compare:
    post:
      tags: [Revisions]
      operationId: compareRevisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leftRevisionId, rightRevisionId]
              properties:
                leftRevisionId: { $ref: '#/components/schemas/Uuid' }
                rightRevisionId: { $ref: '#/components/schemas/Uuid' }
              additionalProperties: false
      responses:
        '200':
          description: Causal relation independent of wall-clock order
          content:
            application/json:
              schema:
                type: object
                required: [classification]
                properties:
                  classification:
                    enum: [identical, left-ancestor, right-ancestor, concurrent]
  /v1/revisions/{revisionId}/restore:
    post:
      tags: [Revisions]
      operationId: restoreRevision
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/MutationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentRevisionId]
              properties:
                currentRevisionId: { $ref: '#/components/schemas/Uuid' }
              additionalProperties: false
      responses:
        '200':
          description: Retained revision content restored as a new descendant revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /v1/changes:
    get:
      tags: [Revisions]
      operationId: listChangesAfterCursor
      parameters:
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Contiguous ordered canonical changes
          content:
            application/json:
              schema:
                type: object
                required: [changes, nextCursor, hasMore]
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/ChangeEnvelope' }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
        '409':
          description: Cursor compacted; a verified replacement snapshot is required
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/page-operations/{pageId}/activate:
    post:
      tags: [Page Operations]
      operationId: activatePageOperations
      description: >-
        Atomically creates the verified Loro checkpoint for a legacy page whose
        revision and canonical v3 digest still match the client.
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/ClientProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivatePageOperations' }
      responses:
        '200':
          description: Existing or newly verified operational checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOperationCheckpoint' }
        '409': { $ref: '#/components/responses/PageOperationProblem' }
        '426': { $ref: '#/components/responses/PageOperationProblem' }
  /v1/page-operations/{pageId}/sync:
    post:
      tags: [Page Operations]
      operationId: synchronizePageOperations
      description: >-
        Confirms a durable client frontier, imports bounded incremental updates
        idempotently, and returns only causally missing updates or a checkpoint.
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/ClientProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageOperationSyncRequest' }
      responses:
        '200':
          description: Incremental exchange, checkpoint, or legacy-branch conversion
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ActivePageOperationSyncResponse' }
                  - { $ref: '#/components/schemas/PageOperationCheckpoint' }
        '409': { $ref: '#/components/responses/PageOperationProblem' }
        '426': { $ref: '#/components/responses/PageOperationProblem' }
  /v1/page-ambiguities/{ambiguityId}:
    get:
      tags: [Page Operations]
      operationId: getPageAmbiguity
      parameters:
        - $ref: '#/components/parameters/AmbiguityId'
        - $ref: '#/components/parameters/ClientProtocol'
      responses:
        '200':
          description: Protected recoverable alternatives and resolution choices
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/page-ambiguities/{ambiguityId}/resolve:
    post:
      tags: [Page Operations]
      operationId: resolvePageAmbiguity
      parameters:
        - $ref: '#/components/parameters/AmbiguityId'
        - $ref: '#/components/parameters/ClientProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolvePageAmbiguity' }
      responses:
        '200':
          description: Resolution operation and resulting canonical revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivePageOperationSyncResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/PageOperationProblem' }
  /v1/mutations/batch:
    post:
      tags: [Revisions]
      operationId: submitMutationBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutations]
              properties:
                mutations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/QueuedMutation' }
              additionalProperties: false
      responses:
        '200':
          description: Per-mutation accepted, already-accepted, rejected, or conflict results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/QueuedMutationResult' }
  /v1/snapshots/current:
    get:
      tags: [Revisions]
      operationId: getCurrentVerifiedSnapshot
      responses:
        '200':
          description: Verified replacement projection and its contiguous change cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalSnapshot' }
  /v1/export:
    post:
      tags: [Export]
      operationId: createCanonicalExport
      responses:
        '202':
          description: Durable export prepared for independent validation
          content:
            application/json:
              schema:
                type: object
                required: [exportId, status]
                properties:
                  exportId: { $ref: '#/components/schemas/Uuid' }
                  status: { const: pending }
  /v1/export/{exportId}:
    get:
      tags: [Export]
      operationId: getCanonicalExport
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Export status and verified artifact metadata when ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ClientProtocol:
      in: header
      name: X-MyOwnNotion-Client-Protocol
      required: true
      schema: { type: integer, minimum: 3 }
    PageId:
      in: path
      name: pageId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AmbiguityId:
      in: path
      name: ambiguityId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ItemId:
      in: path
      name: itemId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PlacementId:
      in: path
      name: placementId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RevisionId:
      in: path
      name: revisionId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RelationshipId:
      in: path
      name: relationshipId
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MutationId:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated UUIDv7 mutation identity
      schema: { $ref: '#/components/schemas/Uuid' }
  responses:
    PageOperationProblem:
      description: Stable convergent synchronization refusal
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PageOperationProblem' }
    Problem:
      description: Safe validation, conflict, or integrity error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageOperationDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    PageOperationBase64Url:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
    PageOperationUpdate:
      type: object
      required: [updateId, baseVersionVector, updateBytes, updateDigest, createdAt]
      properties:
        updateId: { $ref: '#/components/schemas/Uuid' }
        baseVersionVector: { $ref: '#/components/schemas/PageOperationBase64Url' }
        updateBytes: { $ref: '#/components/schemas/PageOperationBase64Url' }
        updateDigest: { $ref: '#/components/schemas/PageOperationDigest' }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    RemotePageOperationUpdate:
      type: object
      required: [updateId, pageSequence, authoredByDeviceId, updateBytes, updateDigest, acceptedAt]
      properties:
        updateId: { $ref: '#/components/schemas/Uuid' }
        pageSequence: { type: integer, minimum: 1 }
        authoredByDeviceId: { $ref: '#/components/schemas/Uuid' }
        updateBytes: { $ref: '#/components/schemas/PageOperationBase64Url' }
        updateDigest: { $ref: '#/components/schemas/PageOperationDigest' }
        acceptedAt: { type: string, format: date-time }
      additionalProperties: false
    PageAmbiguitySummary:
      type: object
      required: [ambiguityId, pageId, kind, blockIds, openedAt, status]
      properties:
        ambiguityId: { $ref: '#/components/schemas/Uuid' }
        pageId: { $ref: '#/components/schemas/Uuid' }
        kind: { enum: [delete-edit, delete-move, type-transform, property-transform, schema] }
        blockIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        openedAt: { type: string, format: date-time }
        status: { const: open }
      additionalProperties: false
    ActivatePageOperations:
      type: object
      required: [requestId, expectedRevisionId, expectedCanonicalDigest]
      properties:
        requestId: { $ref: '#/components/schemas/Uuid' }
        expectedRevisionId: { $ref: '#/components/schemas/Uuid' }
        expectedCanonicalDigest: { $ref: '#/components/schemas/PageOperationDigest' }
      additionalProperties: false
    PageOperationSyncRequest:
      oneOf:
        - type: object
          required: [mode, requestId, operationalVersion, persistedVersionVector, knownServerPageSequence, updates, maxRemoteBytes]
          properties:
            mode: { const: active }
            requestId: { $ref: '#/components/schemas/Uuid' }
            operationalVersion: { const: 1 }
            persistedVersionVector: { $ref: '#/components/schemas/PageOperationBase64Url' }
            knownServerPageSequence: { type: integer, minimum: 0 }
            updates:
              type: array
              maxItems: 64
              items: { $ref: '#/components/schemas/PageOperationUpdate' }
            maxRemoteBytes: { type: integer, minimum: 1, maximum: 1048576 }
            revisionBoundary: { const: editor-closed }
          additionalProperties: false
        - type: object
          required: [mode, requestId, knownServerPageSequence, maxRemoteBytes]
          properties:
            mode: { const: empty }
            requestId: { $ref: '#/components/schemas/Uuid' }
            knownServerPageSequence: { const: 0 }
            maxRemoteBytes: { type: integer, minimum: 1, maximum: 1048576 }
          additionalProperties: false
        - type: object
          description: One-time semantic bridge for a v2 page edited while offline.
          required: [mode, requestId, branchId, baseRevisionId, baseCanonicalDigest, localDocument, localDocumentDigest, semanticTransactions, createdAt]
          properties:
            mode: { const: legacy-branch }
            requestId: { $ref: '#/components/schemas/Uuid' }
            branchId: { $ref: '#/components/schemas/Uuid' }
            baseRevisionId: { $ref: '#/components/schemas/Uuid' }
            baseCanonicalDigest: { $ref: '#/components/schemas/PageOperationDigest' }
            baseDocument: { $ref: '#/components/schemas/PageDocument' }
            localDocument: { $ref: '#/components/schemas/PageDocument' }
            localDocumentDigest: { $ref: '#/components/schemas/PageOperationDigest' }
            semanticTransactions: { type: array, maxItems: 10000, items: { type: object } }
            createdAt: { type: string, format: date-time }
          additionalProperties: false
    PageOperationCheckpoint:
      type: object
      required: [mode, requestId, pageId, operationalVersion, checkpointId, checkpointBytes, checkpointDigest, versionVector, throughPageSequence, canonicalDigest, lastConsolidatedRevisionId, hasUnconsolidatedChanges, followingUpdates, latestPageSequence, hasMore, ambiguities]
      properties:
        mode: { const: checkpoint }
        requestId: { $ref: '#/components/schemas/Uuid' }
        pageId: { $ref: '#/components/schemas/Uuid' }
        operationalVersion: { const: 1 }
        checkpointId: { $ref: '#/components/schemas/Uuid' }
        checkpointBytes: { $ref: '#/components/schemas/PageOperationBase64Url' }
        checkpointDigest: { $ref: '#/components/schemas/PageOperationDigest' }
        versionVector: { $ref: '#/components/schemas/PageOperationBase64Url' }
        throughPageSequence: { type: integer, minimum: 0 }
        canonicalDigest: { $ref: '#/components/schemas/PageOperationDigest' }
        lastConsolidatedRevisionId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        hasUnconsolidatedChanges: { type: boolean }
        followingUpdates:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/RemotePageOperationUpdate' }
        latestPageSequence: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        ambiguities:
          type: array
          items: { $ref: '#/components/schemas/PageAmbiguitySummary' }
      additionalProperties: false
    ActivePageOperationSyncResponse:
      type: object
      required: [mode, requestId, pageId, accepted, repeated, remoteUpdates, serverVersionVector, throughPageSequence, latestPageSequence, hasMore, canonical, ambiguities, fileRequirements]
      properties:
        mode: { const: active }
        requestId: { $ref: '#/components/schemas/Uuid' }
        pageId: { $ref: '#/components/schemas/Uuid' }
        accepted: { type: array, maxItems: 64, items: { type: object } }
        repeated: { type: array, maxItems: 64, items: { type: object } }
        remoteUpdates:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/RemotePageOperationUpdate' }
        serverVersionVector: { $ref: '#/components/schemas/PageOperationBase64Url' }
        throughPageSequence: { type: integer, minimum: 0 }
        latestPageSequence: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        canonical:
          type: object
          required: [format, formatVersion, digest, lastConsolidatedRevisionId, hasUnconsolidatedChanges]
          properties:
            format: { const: myownnotion.document+json }
            formatVersion: { const: 3 }
            digest: { $ref: '#/components/schemas/PageOperationDigest' }
            lastConsolidatedRevisionId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            hasUnconsolidatedChanges: { type: boolean }
          additionalProperties: false
        ambiguities:
          type: array
          items: { $ref: '#/components/schemas/PageAmbiguitySummary' }
        fileRequirements: { type: array, items: { type: object } }
      additionalProperties: false
    ResolvePageAmbiguity:
      oneOf:
        - type: object
          required: [requestId, decision]
          properties:
            requestId: { $ref: '#/components/schemas/Uuid' }
            decision: { const: confirm-delete }
          additionalProperties: false
        - type: object
          required: [requestId, decision, parentBlockId, beforeBlockId]
          properties:
            requestId: { $ref: '#/components/schemas/Uuid' }
            decision: { enum: [restore-change, custom] }
            parentBlockId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            beforeBlockId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            result: { type: object }
          additionalProperties: false
    PageOperationProblem:
      type: object
      required: [code, message]
      properties:
        code:
          enum:
            - page-operations.protocol-read-only
            - page-operations.not-active
            - page-operations.activation-stale
            - page-operations.update-id-reused
            - page-operations.digest-mismatch
            - page-operations.dependencies-missing
            - page-operations.projection-invalid
            - page-operations.device-revoked
            - page-operations.rotation-blocked
            - page-operations.quota
            - page-operations.schema-unsupported
        message: { type: string, minLength: 1, maxLength: 1000 }
        requiredProtocol: { const: 3 }
        readAllowed: { type: boolean }
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
    DisplayName:
      type: string
      minLength: 1
      maxLength: 512
    ItemKind:
      enum: [page, folder, file]
    Lifecycle:
      enum: [active, trashed, purged]
    PlacementKind:
      enum: [hierarchy, attachment]
    SearchHealth:
      type: object
      required: [state, generation, indexedCount, expectedCount, failureCode]
      properties:
        state:
          enum: [cold, building, ready, degraded]
        generation:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: 'null' }
        indexedCount: { type: integer, minimum: 0 }
        expectedCount: { type: integer, minimum: 0 }
        failureCode:
          oneOf:
            - { type: string, maxLength: 128 }
            - { type: 'null' }
      additionalProperties: false
    PageDocument:
      type: object
      required: [format, formatVersion, body]
      properties:
        format: { const: myownnotion.document+json }
        formatVersion: { type: integer, minimum: 1 }
        body: { type: object }
      additionalProperties: false
    Placement:
      type: object
      required: [id, itemId, kind, parentItemId, positionKey]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        itemId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/PlacementKind' }
        parentItemId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        positionKey: { type: string }
    Item:
      type: object
      required: [id, kind, name, lifecycle, currentRevisionId, placements]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        name: { $ref: '#/components/schemas/DisplayName' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        currentRevisionId: { $ref: '#/components/schemas/Uuid' }
        trashedAt: { type: [string, 'null'], format: date-time }
        purgeAfter: { type: [string, 'null'], format: date-time }
        pageDocument:
          oneOf:
            - { $ref: '#/components/schemas/PageDocument' }
            - { type: 'null' }
        placements:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
      allOf:
        - if:
            properties: { kind: { const: page } }
          then:
            required: [pageDocument]
        - if:
            properties: { kind: { enum: [folder, file] } }
          then:
            properties: { pageDocument: { type: 'null' } }
    CreatePlacement:
      type: object
      required: [kind, parentItemId, positionKey]
      properties:
        id:
          allOf:
            - { $ref: '#/components/schemas/Uuid' }
          description: >-
            Optional client-generated UUIDv7 placement identity, so offline
            projections and the canonical store share one placement identity.
        kind: { $ref: '#/components/schemas/PlacementKind' }
        parentItemId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        positionKey: { type: string, minLength: 1, maxLength: 255 }
      additionalProperties: false
    CreateItem:
      type: object
      required: [id, kind, name, placement]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { enum: [page, folder] }
        name: { $ref: '#/components/schemas/DisplayName' }
        placement: { $ref: '#/components/schemas/CreatePlacement' }
        pageDocument: { $ref: '#/components/schemas/PageDocument' }
      additionalProperties: false
      allOf:
        - if:
            properties: { kind: { const: page } }
          then:
            required: [pageDocument]
        - if:
            properties: { kind: { const: folder } }
          then:
            not: { required: [pageDocument] }
    CreateRelationship:
      type: object
      required: [id, sourceItemId, targetItemId, relationType]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sourceItemId: { $ref: '#/components/schemas/Uuid' }
        targetItemId: { $ref: '#/components/schemas/Uuid' }
        # `page-link` is the reserved non-hierarchical edge used by inline
        # references in page documents; it never creates a placement.
        relationType: { type: string, pattern: '^[a-z][a-z0-9.-]*:[a-z][a-z0-9.-]*$' }
        metadata: { type: object }
      additionalProperties: false
    Relationship:
      allOf:
        - $ref: '#/components/schemas/CreateRelationship'
        - type: object
          required: [createdRevisionId]
          properties:
            createdRevisionId: { $ref: '#/components/schemas/Uuid' }
            removedRevisionId:
              oneOf:
                - { $ref: '#/components/schemas/Uuid' }
                - { type: 'null' }
    Revision:
      type: object
      required: [id, itemId, mutationId, parentRevisionIds, acceptedAt, snapshotRetained]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        itemId: { $ref: '#/components/schemas/Uuid' }
        mutationId: { $ref: '#/components/schemas/Uuid' }
        parentRevisionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        acceptedAt: { type: string, format: date-time }
        snapshotRetained: { type: boolean }
        snapshot: { type: [object, 'null'] }
        snapshotExpiresAt: { type: [string, 'null'], format: date-time }
    MutationResult:
      type: object
      required: [mutationId, revisionIds]
      properties:
        mutationId: { $ref: '#/components/schemas/Uuid' }
        nature: { type: string, minLength: 1, maxLength: 128 }
        revisionIds:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Uuid' }
        item: { $ref: '#/components/schemas/Item' }
    TrashImpact:
      type: object
      required: [isDatabase, activeEntryCount]
      properties:
        isDatabase: { type: boolean }
        activeEntryCount: { type: integer, minimum: 0 }
      additionalProperties: false
    ChangeEnvelope:
      type: object
      required: [sequence, mutationId, revisionIds]
      properties:
        sequence: { type: integer, minimum: 1 }
        mutationId: { $ref: '#/components/schemas/Uuid' }
        revisionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        changedItems:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        relationships:
          type: array
          items: { $ref: '#/components/schemas/Relationship' }
        databases:
          type: array
          items: { $ref: '#/components/schemas/DatabaseProjection' }
        databaseEntries:
          type: array
          items: { $ref: '#/components/schemas/DatabaseEntryProjection' }
    DatabaseProjection:
      type: object
      required: [itemId, definitionVersion, definition]
      properties:
        itemId: { $ref: '#/components/schemas/Uuid' }
        definitionVersion: { type: integer, minimum: 1 }
        definition:
          type: object
          description: Opened DatabaseDefinition payload defined by feature 009.
      additionalProperties: false
    DatabaseEntryProjection:
      type: object
      required: [entryItemId, databaseId, valueVersion, values]
      properties:
        entryItemId: { $ref: '#/components/schemas/Uuid' }
        databaseId: { $ref: '#/components/schemas/Uuid' }
        valueVersion: { type: integer, minimum: 1 }
        values:
          type: object
          description: Full opened EntryValues payload, including preserved values.
      additionalProperties: false
    QueuedMutation:
      type: object
      required: [mutationId, commandType, baseRevisionIds, payload]
      properties:
        mutationId: { $ref: '#/components/schemas/Uuid' }
        commandType: { type: string, minLength: 1 }
        baseRevisionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        payload: { type: object }
      additionalProperties: false
    QueuedMutationResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId: { $ref: '#/components/schemas/Uuid' }
        status: { enum: [accepted, already-accepted, rejected, conflict] }
        revisionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        competingRevisionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        problem: { $ref: '#/components/schemas/Problem' }
    CanonicalSnapshot:
      type: object
      required: [workspaceId, schemaVersion, cursor, digest, items, relationships]
      properties:
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        schemaVersion: { type: integer, minimum: 1 }
        cursor: { type: string }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        relationships:
          type: array
          items: { $ref: '#/components/schemas/Relationship' }
        databases:
          type: array
          items: { $ref: '#/components/schemas/DatabaseProjection' }
        databaseEntries:
          type: array
          items: { $ref: '#/components/schemas/DatabaseEntryProjection' }
    ExportStatus:
      type: object
      required: [exportId, status]
      properties:
        exportId: { $ref: '#/components/schemas/Uuid' }
        status: { enum: [pending, ready, failed] }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        downloadPath: { type: string, format: uri-reference }
        problem: { $ref: '#/components/schemas/Problem' }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        invalidFields:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
