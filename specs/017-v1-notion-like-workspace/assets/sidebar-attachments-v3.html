    #mn-sidebar-attachments-v3 .mn-v3-app-shell.is-sidebar-collapsed .mn-v3-sidebar {

    #mn-sidebar-attachments-v3 *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }

</style>

<script>
  (() => {
    const root = document.getElementById("mn-sidebar-attachments-v3");
    if (!root) return;

    const appShell = root.querySelector("[data-app-shell]");
    const row = root.querySelector("[data-main-row]");
    const createToggle = root.querySelector("[data-create-toggle]");
    const createOverlay = root.querySelector("[data-create-overlay]");
    const createSurface = root.querySelector("[data-create-surface]");
    const moreToggle = root.querySelector("[data-more]");
    const moreMenu = root.querySelector("[data-more-menu]");
    const attachmentToggle = root.querySelector("[data-attachments]");
    const attachmentPanel = root.querySelector("[data-attachment-panel]");
    const filesState = root.querySelector("[data-files-state]");
    const emptyState = root.querySelector("[data-empty-state]");
    const attachmentHeading = root.querySelector("[data-attachment-heading]");
    const attachmentCount = root.querySelector("[data-attachment-count]");
    const feedback = root.querySelector("[data-feedback]");
    let creationCloseTimer = null;

    const closeCreation = () => {
      if (createOverlay.hidden || createOverlay.classList.contains("is-closing")) return;
      createToggle.setAttribute("aria-expanded", "false");
      createOverlay.classList.add("is-closing");
      createSurface.classList.add("is-closing");
      creationCloseTimer = window.setTimeout(() => {
        createOverlay.hidden = true;
        createOverlay.classList.remove("is-closing");
        createSurface.classList.remove("is-closing");
        row.classList.remove("is-create-open");
        creationCloseTimer = null;
      }, 210);
    };

    const openCreation = () => {
      if (creationCloseTimer !== null) {
        window.clearTimeout(creationCloseTimer);
        creationCloseTimer = null;
      }
      createOverlay.hidden = false;
      createOverlay.classList.remove("is-closing");
      createSurface.classList.remove("is-closing");
      createToggle.setAttribute("aria-expanded", "true");
      row.classList.add("is-create-open");
    };

    const closeMore = () => {
      moreMenu.hidden = true;
      moreToggle.setAttribute("aria-expanded", "false");
    };

    const setAttachmentsOpen = (open) => {
      attachmentPanel.classList.toggle("is-collapsed", !open);
      attachmentPanel.setAttribute("aria-hidden", String(!open));
      attachmentToggle.setAttribute("aria-expanded", String(open));
      attachmentToggle.setAttribute("aria-label", `${open ? "Masquer" : "Afficher"} les pièces jointes`);
      row.classList.toggle("has-attachments-open", open);
    };

    root.querySelectorAll("[data-state]").forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.getAttribute("data-state");
        root.querySelectorAll("[data-state]").forEach((candidate) => {
          candidate.setAttribute("aria-pressed", String(candidate === button));
        });
        const hasFiles = mode === "files";
        attachmentHeading.hidden = !hasFiles;
        filesState.hidden = !hasFiles;
        emptyState.hidden = hasFiles;
        attachmentCount.textContent = hasFiles ? "2" : "0";
        setAttachmentsOpen(true);
        feedback.textContent = hasFiles ? "Exemple avec deux pièces jointes." : "Exemple compact sans pièce jointe.";
      });
    });

    root.querySelector("[data-sidebar-close]").addEventListener("click", () => {
      closeCreation();
      closeMore();
      appShell.classList.add("is-sidebar-collapsed");
      feedback.textContent = "La barre latérale est masquée.";
      window.setTimeout(() => root.querySelector("[data-sidebar-open]").focus(), 230);
    });

    root.querySelector("[data-sidebar-open]").addEventListener("click", () => {
      appShell.classList.remove("is-sidebar-collapsed");
      feedback.textContent = "La barre latérale est affichée.";
      window.setTimeout(() => root.querySelector("[data-sidebar-close]").focus(), 230);
    });

    createToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const opening = createToggle.getAttribute("aria-expanded") !== "true";
      closeMore();
      if (opening) {
        openCreation();
        createOverlay.querySelector("button")?.focus();
      } else {
        closeCreation();
      }
    });

    root.querySelectorAll("[data-create-kind]").forEach((button) => {
      button.addEventListener("click", () => {
        const kind = button.getAttribute("data-create-kind") === "folder" ? "dossier" : "page";
        closeCreation();
        feedback.textContent = `Une nouvelle ${kind} sera créée sous Projet Atlas.`;
      });
    });

    moreToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const opening = moreMenu.hidden;
      closeCreation();
      if (opening) {
        moreMenu.hidden = false;
        moreToggle.setAttribute("aria-expanded", "true");
        moreMenu.querySelector("button")?.focus();
      } else {
        closeMore();
      }
    });

    root.querySelector("[data-disclosure]").addEventListener("click", (event) => {
      event.stopPropagation();
      const children = root.querySelector("[data-children]");
      const collapsed = row.classList.toggle("is-collapsed");
      children.classList.toggle("is-collapsed", collapsed);
      event.currentTarget.setAttribute("aria-expanded", String(!collapsed));
      event.currentTarget.setAttribute("aria-label", `${collapsed ? "Déplier" : "Replier"} Projet Atlas`);
      row.closest("[role='treeitem']").setAttribute("aria-expanded", String(!collapsed));
    });

    attachmentToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const opening = attachmentPanel.classList.contains("is-collapsed");
      setAttachmentsOpen(opening);
      feedback.textContent = opening ? "Les pièces jointes sont affichées." : "Les pièces jointes sont masquées.";
    });

    root.addEventListener("click", (event) => {
      if (!event.target.closest("[data-create-overlay], [data-create-toggle]")) closeCreation();
      if (!event.target.closest("[data-more-menu], [data-more]")) closeMore();
    });

    root.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      closeCreation();
      closeMore();
      createToggle.focus();
    });
  })();
</script>
